# LibreChat 主应用 - 本地构建/验证用 compose
# 用法（在项目根目录执行）:
#   docker compose -f docker/docker-compose.custom.yml up -d --build
#
# 与 deploy-compose.yml 的关系：本文件仅用于【本地构建镜像 + 起最小依赖验证】，
# 包含 api（本地构建的 librechat-dev-api:custom）+ mongodb 两个服务。
# 真实部署仍使用项目根目录的 deploy-compose.yml（把其中 api 服务的 image 换成本地标签即可，见 README.md）。
#
# 环境变量（在项目根目录 .env 中读取，与 deploy-compose.yml 共用）:
#   MONGO_URI       覆盖用，默认 mongodb://mongodb:27017/LibreChat
#   LIBRECHAT_PORT  宿主机映射端口，默认 13080

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: librechat-dev-api:custom
    container_name: librechat-custom-api
    restart: unless-stopped
    ports:
      - "${LIBRECHAT_PORT:-13080}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI_OVERRIDE:-mongodb://mongodb:27017/LibreChat}
      # JWT/CREDS 密钥留空则自动生成到 /app/data/.env.temp（匿名卷，仅本地验证用）
      - LIBRECHAT_TEMP_CREDENTIALS_PATH=/app/data/.env.temp
      - SEARCH=${SEARCH:-false}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},mongodb,host.docker.internal
    volumes:
      # 本地验证时直接挂项目根目录的 librechat.yaml（内网大模型端点配置）
      - type: bind
        source: ../librechat.yaml
        target: /app/librechat.yaml
    depends_on:
      - mongodb

  mongodb:
    container_name: librechat-custom-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    volumes:
      - librechat-custom-data:/data/db
    command: mongod --noauth

volumes:
  librechat-custom-data:
